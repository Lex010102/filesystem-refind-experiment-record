<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125">
<title>Token F1 distribution by frozen LLM judge label</title>
<desc>A three-by-five teal heatmap shows the distribution of Token F1 scores within the Correct, Partial, and Incorrect frozen LLM judge labels for 900 answers. Each cell reports an answer count and the percentage within that judge label.</desc>
