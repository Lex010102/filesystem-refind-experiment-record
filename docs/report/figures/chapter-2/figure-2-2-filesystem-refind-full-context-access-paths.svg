="58" rx="14" fill="#DDF3F1" stroke="#0A8C86" stroke-width="2.3"/><text x="800" y="658.46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="800" dy="0">finish_search → EvidenceBundle</tspan></text><path d="M 800 375 L 800 388" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTealFixed10)"/><path d="M 800 452 L 800 465" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTealFixed10)"/><path d="M 800 529 L 800 542" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTealFixed10)"/><path d="M 800 606 L 800 619" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTealFixed10)"/><path d="M 990 575 H 1025 V 421 H 1000" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrowTealFixed10)"/><rect x="1110" y="315" width="390" height="58" rx="14" fill="#F1F5F8" stroke="#A8BAC9" stroke-width="2.3"/><g fill="#FFFFFF" stroke="#0F2D4E" stroke-width="2.16" stroke-linejoin="round"><rect x="1136.64" y="329.6" width="24.96" height="29.759999999999998" rx="2.4"/><rect x="1143.84" y="335.36" width="24.96" height="29.759999999999998" rx="2.4"/><path d="M 1149.6 343.52 h 13.44 M 1149.6 349.76 h 13.44 M 1149.6 356 h 9.6" fill="none" stroke="#DA902D"/></g><text x="1188" y="351.48" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="1188" dy="0">Complete raw history</tspan></text><rect x="1110" y="392" width="390" height="58" rx="14" fill="#FCE9CF" stroke="#DA902D" stroke-width="2.3"/><text x="1305" y="428.48" text-anchor="middle" font-family="Arial, Helvet