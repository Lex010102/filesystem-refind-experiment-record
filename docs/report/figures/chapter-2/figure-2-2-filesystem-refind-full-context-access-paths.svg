oke="#0F2D4E" stroke-width="2.16" stroke-linejoin="round"><rect x="126.64" y="560.6" width="24.96" height="29.759999999999998" rx="2.4"/><rect x="133.84" y="566.36" width="24.96" height="29.759999999999998" rx="2.4"/><path d="M 139.6 574.52 h 13.44 M 139.6 580.76 h 13.44 M 139.6 587 h 9.6" fill="none" stroke="#0A8C86"/></g><text x="178" y="582.48" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="178" dy="0">Selected passages</tspan></text><rect x="100" y="623" width="390" height="58" rx="14" fill="#DDF3F1" stroke="#0A8C86" stroke-width="2.3"/><g fill="#FFFFFF" stroke="#0F2D4E" stroke-width="2.16" stroke-linejoin="round"><rect x="126.64" y="637.6" width="24.96" height="29.759999999999998" rx="2.4"/><rect x="133.84" y="643.36" width="24.96" height="29.759999999999998" rx="2.4"/><path d="M 139.6 651.52 h 13.44 M 139.6 657.76 h 13.44 M 139.6 664 h 9.6" fill="none" stroke="#0A8C86"/></g><text x="178" y="659.48" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="178" dy="0">EvidenceBundle</tspan></text><path d="M 295 375 L 295 388" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTealFixed10)"/><path d="M 295 452 L 295 465" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTealFixed10)"/><path d="M 295 529 L 295 542" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTealFixed10)"/><path d="M 295 606 L 295 619" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTealFixed10)"/><rect x="605" y="315" width="390" height="58" rx="14" fill="#F1F5F8" stroke="#A8BAC9" stroke-width="2.3"/><g fill="none" stroke="#0F2D4E" stroke