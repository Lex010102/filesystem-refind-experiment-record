g="0" text-rendering="geometricPrecision"><tspan x="1077.5" dy="0">Judging</tspan></text><text x="1077.5" y="766" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#60788E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="1077.5" dy="0">separate evaluation cost</tspan></text><rect x="1235" y="718" width="235" height="58" rx="14" fill="#FFFFFF" stroke="#DA902D" stroke-width="1.8"/><text x="1352.5" y="742" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="1352.5" dy="0">Recovery</tspan></text><text x="1352.5" y="766" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#60788E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="1352.5" dy="0">latency / failures / retries</tspan></text><text x="800" y="851" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="800" dy="0">No single metric identifies both answer quality and the stage that produced it</tspan></text></svg>