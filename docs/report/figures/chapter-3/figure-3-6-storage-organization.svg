<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0F2D4E" flood-opacity="0.13"/></filter>
    <linearGradient id="navyBand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173E67"/><stop offset="1" stop-color="#0F2D4E"/></linearGradient>
    <linearGradient id="tealBand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13A099"/><stop offset="1" stop-color="#087F7A"/></linearGradient>
    <linearGradient id="amberBand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8A33A"/><stop offset="1" stop-color="#CF821E"/></linearGradient>
    <marker id="arrowNavy" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#0F2D4E"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#2D9D96"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#DA902D"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FEFEFE"/>
  <text x="800" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#0F2D4E" font-style="normal" text-rendering="geometricPrecision"><tspan x="800" dy="0">Three Frozen Memory Representations</tspan></text>
  <text x="800" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#60788E" font-style="normal" text-rendering="geometricPrecision"><tspan x="800" dy="0">One canonical conversation is serialised as flat sessions, organised sessions, or curated memory</tspan></text><rect x="455" y="120" width="690" height="72" rx="17" fill="#E9F0F5" stroke="#0F2D4E" stroke-width="3" filter="url(#shadow)"/><text x="800" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#0F2D4E" font-style="normal" text-rendering="geometricPrecision"><tspan x="800" dy="0">Canonical conversation</tspan></text><text x="800" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#60788E" font-style="normal" text-rendering="geometricPrecision"><tspan x="800" dy="0">30 sessions  ·  568 source turns  ·  common source map</tspan></text><path d="M 800 192 V 218 H 280 V 252" fill="none" stroke="#0F2D4E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowNavy)"/><path d="M 800 192 L 800 252" fill="none" stroke="#2D9D96" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTeal)"/><path d="M 800 192 V 218 H 1280 V 252" fill="none" stroke="#DA902D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/><rect x="40" y="260" width="480" height="484" rx="18" fill="#F1F5F8" stroke="#A8BAC9" stroke-width="2.6" filter="url(#shadow)"/><path d="M 58 260 H 502 Q 520 260 520 278 V 318 H 40 V 278 Q 40 260 58 260 Z" fill="url(#navyBand)"/><text x="280" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" font-style="normal" text-rendering="geometricPrecision"><tspan x="280" dy="0">S1  Flat Raw Sessions</tspan></text><text x="66" y="352" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="500" fill="#0F2D4E" font-style="normal" text-rendering="geometricPrecision"><tspan x="66" dy="0">/memories/</tspan><tspan x="66" dy="1.34em">├── session-01.md</tspan><tspan x="66" dy="1.34em">├── session-02.md</tspan><tspan x="66" dy="1.34em">├── …</tspan><tspan x="66" dy="1.34em">└── session-30.md</tspan><tspan x="66" dy="1.34em"></tspan><tspan x="66" dy="1.34em">30 flat Markdown files</tspan><tspan x="66" dy="1.34em">114,456 bytes</tspan></text><text x="280" y="712" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#60788E" font-style="normal" text-rendering="geometricPrecision"><tspan x="280" dy="0">Raw chronological turns</tspan><tspan x="280" dy="1.12em">+ canonical [SxTy] locators</tspan></text><rect x="540" y="260" width="480" height="484" rx="18" fill="#DDF3F1" stroke="#0A8C86" stroke-width="2.6" filter="url(#shadow)"/><path d="M 558 260 H 1002 Q 1020 260 1020 278 V 318 H 540 V 278 Q 540 260 558 260 Z" fill="url(#tealBand)"/><text x="780" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" font-style="normal" text-rendering="geometricPrecision"><tspan x="780" dy="0">S2  Foldered Raw Sessions</tspan></text><text x="566" y="352" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#0F2D4E" font-style="normal" text-rendering="geometricPrecision"><tspan x="566" dy="0">/memories/</tspan><tspan x="566" dy="1.34em">├── cars-and-auto-work/       11</tspan><tspan x="566" dy="1.34em">├── music-and-performance/    14</tspan><tspan x="566" dy="1.34em">├── photography/               2</tspan><tspan x="566" dy="1.34em">└── travel-and-outdoors/       3</tspan><tspan x="566" dy="1.34em"></tspan><tspan x="566" dy="1.34em">30 files  ·  4 folders</tspan><tspan x="566" dy="1.34em">114,456 bytes</tspan></text><text x="780" y="702" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#0A8C86" font-style="normal" text-rendering="geometricPrecision"><tspan x="780" dy="0">All file bodies are byte-identical to S1</tspan><tspan x="780" dy="1.14em">Only relative paths change</tspan></text><rect x="1040" y="260" width="480" height="484" rx="18" fill="#FCE9CF" stroke="#DA902D" stroke-width="2.6" filter="url(#shadow)"/><path d="M 1058 260 H 1502 Q 1520 260 1520 278 V 318 H 1040 V 278 Q 1040 260 1058 260 Z" fill="url(#amberBand)"/><text x="1280" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" font-style="normal" text-rendering="geometricPrecision"><tspan x="1280" dy="0">S3  Agent-Curated Memory</tspan></text><text x="1066" y="352" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="500" fill="#0F2D4E" font-style="normal" text-rendering="geometricPrecision"><tspan x="1066" dy="0">/memories/</tspan><tspan x="1066" dy="1.34em">├── calvin.md</tspan><tspan x="1066" dy="1.34em">│   ├── # Entity</tspan><tspan x="1066" dy="1.34em">│   ├── ## Topic groups (18)</tspan><tspan x="1066" dy="1.34em">│   └── - Fact [source locator(s)]</tspan><tspan x="1066" dy="1.34em">└── dave.md</tspan><tspan x="1066" dy="1.34em">    ├── ## Topic groups (17)</tspan><tspan x="1066" dy="1.34em">    └── - Fact [source locator(s)]</tspan></text><text x="1280" y="702" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#DA902D" font-style="normal" text-rendering="geometricPrecision"><tspan x="1280" dy="0">2 files  ·  35 topic groups  ·  390 facts</tspan><tspan x="1280" dy="1.14em">Curated and provenance-bearing</tspan></text><rect x="168" y="207" width="224" height="32" rx="16" fill="#FEFEFE"/><text x="280" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0F2D4E" font-style="normal" text-rendering="geometricPrecision"><tspan x="280" dy="0">verbatim serialisation</tspan></text><rect x="668" y="207" width="224" height="32" rx="16" fill="#FEFEFE"/><text x="780" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0A8C86" font-style="normal" text-rendering="geometricPrecision"><tspan x="780" dy="0">same bodies, new paths</tspan></text><rect x="1168" y="207" width="224" height="32" rx="16" fill="#FEFEFE"/><text x="1280" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#DA902D" font-style="normal" text-rendering="geometricPrecision"><tspan x="1280" dy="0">incremental agent curation</tspan></text><rect x="275" y="786" width="1050" height="66" rx="18" fill="#E9F0F5" stroke="#0F2D4E" stroke-width="2.5"/><text x="800" y="815" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#0F2D4E" font-style="normal" text-rendering="geometricPrecision"><tspan x="800" dy="0">Common provenance contract</tspan></text><text x="800" y="840" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="550" fill="#60788E" font-style="normal" text-rendering="geometricPrecision"><tspan x="800" dy="0">Retained [SxTy] locators resolve to the same canonical conversation through the shared source map.</tspan></text><text x="1530" y="862" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#60788E" font-style="normal" text-rendering="geometricPrecision"><tspan x="1530" dy="0">Figure 3.6 (optional)</tspan></text></svg>