<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1410" viewBox="0 0 1300 1410">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#333333"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#666666"/>
    </marker>
  </defs>
  <rect width="1300" height="1410" fill="#FAFAFA"/>
  <text x="650" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#333333" text-rendering="geometricPrecision"><tspan x="650" dy="0">Evidence Validation and Answerer Handoff</tspan></text>
  <text x="650" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#666666" text-rendering="geometricPrecision"><tspan x="650" dy="0">Observed spans are reconstructed from frozen sources before they can enter the final evidence interface</tspan></text><rect x="84" y="132" width="628" height="1110" rx="14" fill="#F7F7F7" stroke="#B8B8B8" stroke-width="1.8"/><rect x="115" y="155" width="565" height="76" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="3.2"/><text x="397.5" y="200.48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="397.5" dy="0">Retriever observation</tspan></text><path d="M 397.5 231 L 397.5 271" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="115" y="278" width="565" height="76" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="3.2"/><text x="397.5" y="323.48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="397.5" dy="0">Model selects observed range</tspan></text><path d="M 397.5 354 L 397.5 394" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="115" y="401" width="565" height="76" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="3.2"/><text x="397.5" y="446.48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="397.5" dy="0">Host reopens frozen source</tspan></text><path d="M 397.5 477 L 397.5 517" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="115" y="524" width="565" height="76" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="3.2"/><text x="397.5" y="569.48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="397.5" dy="0">Validate range and locator</tspan></text><path d="M 397.5 600 L 397.5 640" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="115" y="647" width="565" height="76" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="3.2"/><text x="397.5" y="692.48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="397.5" dy="0">Resolve canonical source IDs</tspan></text><path d="M 397.5 723 L 397.5 763" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="115" y="770" width="565" height="76" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="3.2"/><text x="397.5" y="815.48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="397.5" dy="0">Merge duplicates and overlaps</tspan></text><path d="M 397.5 846 L 397.5 886" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="115" y="893" width="565" height="76" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="3.2"/><text x="397.5" y="926.5999999999999" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="397.5" dy="0">Apply source order and</tspan><tspan x="397.5" dy="1.12em">16,000-character budget</tspan></text><path d="M 397.5 969 L 397.5 1009" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="115" y="1016" width="565" height="76" rx="8" fill="#F2F2F2" stroke="#333333" stroke-width="3.7"/><text x="397.5" y="1061.48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="750" fill="#333333" text-rendering="geometricPrecision"><tspan x="397.5" dy="0">Final EvidenceBundle</tspan></text><path d="M 397.5 1092 L 397.5 1132" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="115" y="1139" width="565" height="76" rx="8" fill="#F2F2F2" stroke="#333333" stroke-width="3.7"/><text x="397.5" y="1184.48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="750" fill="#333333" text-rendering="geometricPrecision"><tspan x="397.5" dy="0">Condition-blind Answerer</tspan></text><rect x="840" y="401" width="360" height="76" rx="8" fill="#F2F2F2" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1020" y="445.46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="1020" dy="0">No model-written evidence</tspan></text><path d="M 688 439 L 832 439" fill="none" stroke="#666666" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arrowMuted)"/><rect x="840" y="524" width="360" height="76" rx="8" fill="#F2F2F2" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1020" y="568.46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="1020" dy="0">Frozen source is authoritative</tspan></text><path d="M 688 562 L 832 562" fill="none" stroke="#666666" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arrowMuted)"/><rect x="840" y="1103" width="360" height="148" rx="8" fill="#F2F2F2" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1020" y="1162.9599999999998" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" fill="#333333" text-rendering="geometricPrecision"><tspan x="1020" dy="0">Answerer cannot see</tspan><tspan x="1020" dy="1.12em">condition ID · retrieval trace</tspan><tspan x="1020" dy="1.12em">reference answer · gold evidence</tspan></text><path d="M 688 1177 L 832 1177" fill="none" stroke="#666666" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arrowMuted)"/><rect x="205" y="1290" width="970" height="74" rx="8" fill="#F2F2F2" stroke="#333333" stroke-width="3"/><text x="690" y="1334.14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#333333" text-rendering="geometricPrecision"><tspan x="690" dy="0">Only validated, source-linked evidence crosses the Answerer boundary</tspan></text><path d="M 397.5 1215 L 397.5 1283" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/></svg>
