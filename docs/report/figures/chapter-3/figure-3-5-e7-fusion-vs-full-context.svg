.28" rx="2.2"/><rect x="468.52" y="283.08" width="22.88" height="27.28" rx="2.2"/><path d="M 473.8 290.56 h 12.32 M 473.8 296.28 h 12.32 M 473.8 302 h 8.8" fill="none" stroke="#4D60D6"/></g><text x="509" y="287.76" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="509" dy="0">E6 EvidenceBundle</tspan><tspan x="509" dy="1.06em">curated-memory path</tspan></text><path d="M 230 342 V 365 H 405 M 580 342 V 365 H 405" fill="none" stroke="#0F2D4E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="405" y1="365" x2="405" y2="382" stroke="#0F2D4E" stroke-width="3.5" stroke-linecap="round"/><rect x="225" y="382" width="360" height="92" rx="14" fill="#FFFFFF" stroke="#0F2D4E" stroke-width="2.7" filter="url(#shadow)"/><text x="405" y="424.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="405" dy="0">Deterministic fusion</tspan><tspan x="405" dy="1.06em">deduplicate • interleave</tspan></text><rect x="100" y="528" width="270" height="46" rx="23" fill="#FFFFFF" stroke="#0A8C86" stroke-width="2"/><circle cx="125" cy="551" r="15" fill="#0A8C86"/><path d="M 118 551 l 5 6 l 11 -13" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="147" y="557" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#0A8C86" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="147" dy="0">No new retrieval</tspan></text><rect x="439" y="528" width="270" height="46" rx="23" fill="#FFFFFF" stroke="#4D60D6" stroke-width="2"/><circle cx="464" cy="551" r="15" fill="#4D60D6"/><path d="M 457 551 l 5 6 l 11 -13" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="486" y="557" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#4D60D6" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="486" dy="0">Up to 32,000 characters</tspan></text><text x="405" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" fill="#60788E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="405" dy="0">Tests complementarity—and possible interference—</tspan><tspan x="405" dy="1.1em">between two evidence sources</tspan></text><rect x="890" y="233" width="610" height="82" rx="14" fill="#FFFFFF" stroke="#DA902D" stroke-width="2.5"/><g fill="none" stroke="#0F2D4E" stroke-width="1.98" stroke-linejoin="round"><ellipse cx="929" cy="264.32" rx="14.08" ry="5.72" fill="#FFFFFF"/><path d="M 914.92 264.32 v 21.12 c 0 3.52 28.16 3.52 28.16 0 v -21.12" fill="#F1F5F8"/><path d="M 914.92 274 c 0 3.52 28.16 3.52 28.16 0 M 914.92 282.8 c 0 3.52 28.16 3.52 28.16 0"/></g><text x="962" y="281.35" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="750" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="962" dy="0">All 30 S1 raw sessions</tspan></text><line x1="1195" y1="315" x2="1195" y2="363" stroke="#DA902D" stroke-width="4" stroke-linecap="round"/><rect x="890" y="363" width="610" height="82" rx="14" fill="#FFFFFF" stroke="#DA902D" stroke-width="2.5"/><g fill="#FFFFFF" stroke="#0F2D4E" stroke-width="1.98" stroke-linejoin="round"><rect x="914.92" y="390.8" width="22.88" height="27.28" rx="2.2"/><rect x="921.52" y="396.08" width="22.88" height="27.28" rx="2.2"/><path d="M 926.8 403.56 h 12.32 M 926.8 409.28 h 12.32 M 926.8 415 h 8.8" fill="none" stroke="#DA902D"/></g><text x="962" y="411.35" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="750" fill="#0F2D4E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="962" dy="0">Chronological full-history prompt</tspan></text><rect x="884" y="495" width="200" height="46" rx="23" fill="#FFFFFF" stroke="#DA902D" stroke-width="2"/><text x="984" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#DA902D" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="984" dy="0">No retriever</tspan></text><rect x="1094" y="495" width="275" height="46" rx="23" fill="#FFFFFF" stroke="#DA902D" stroke-width="2"/><text x="1231.5" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#DA902D" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="1231.5" dy="0">No selective 16k limit</tspan></text><rect x="1379" y="495" width="132" height="46" rx="23" fill="#FFFFFF" stroke="#D84A49" stroke-width="2"/><text x="1445" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#D84A49" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="1445" dy="0">Not an oracle</tspan></text><text x="1195" y="582" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="650" fill="#60788E" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="1195" dy="0">Complete visibility removes retrieval omission,</tspan><tspan x="1195" dy="1.12em">but not attention or evidence-utilisation errors</tspan></text><path d="M 405 650 V 674 H 760 V 694" fill="none" stroke="#2D9D96" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1195 650 V 674 H 840 V 694" fill="none" stroke="#DA902D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="615" y="694" width="370" height="88" rx="18" fill="#F1F5F8"